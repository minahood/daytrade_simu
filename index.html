<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイトレードシミュレーター</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',Meiryo,sans-serif;min-height:100vh;font-size:14px}

/* ── Header ── */
.header{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header h1{font-size:16px;font-weight:700;color:#58a6ff;white-space:nowrap}
.api-row{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.api-row label{font-size:12px;color:#8b949e;white-space:nowrap}
.api-row input{background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:5px 10px;border-radius:6px;font-size:12px;width:180px}
.api-row input:focus{outline:none;border-color:#58a6ff}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7;cursor:pointer}
input[type="date"]::-webkit-calendar-picker-indicator:hover{opacity:1}
.btn-load{background:#238636;color:#fff;border:none;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap}
.btn-load:hover{background:#2da44e}
.btn-load:disabled{opacity:.5;cursor:not-allowed}

/* ── Stock info bar ── */
.info-bar{background:#161b22;border-bottom:1px solid #30363d;padding:8px 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.info-item{display:flex;flex-direction:column;gap:2px}
.info-label{font-size:11px;color:#8b949e}
.info-value{font-size:15px;font-weight:600}
#currentPrice{font-size:22px;font-weight:700}
.up{color:#3fb950}.down{color:#f85149}.neu{color:#8b949e}
.status-msg{margin-left:auto;font-size:12px;color:#8b949e;padding:4px 10px;background:#21262d;border-radius:6px;max-width:320px;word-break:break-all}

/* ── Charts ── */
.charts-wrap{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#30363d}
.chart-panel{background:#0d1117;padding:10px}
.chart-label{font-size:12px;color:#8b949e;margin-bottom:6px}
canvas{display:block;width:100%;height:280px}

/* ── Controls ── */
.controls{background:#161b22;border-top:1px solid #30363d;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sim-time{font-size:26px;font-weight:700;font-family:monospace;color:#f0f6fc;min-width:70px}
.ctrl-btn{padding:7px 18px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:opacity .15s}
.ctrl-btn:hover{opacity:.85}
.ctrl-btn:disabled{opacity:.35;cursor:not-allowed}
.btn-start{background:#238636;color:#fff}
.btn-pause{background:#9a6700;color:#fff}
.btn-fast{background:#388bfd;color:#fff}
.btn-fast.active{background:#f85149}
.btn-reset{background:#484f58;color:#fff}
.speed-label{font-size:12px;color:#8b949e;margin-left:4px}

/* ── Trading + PnL ── */
.bottom{display:grid;grid-template-columns:auto 1fr;gap:1px;background:#30363d}
.trade-panel{background:#161b22;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:260px}
.trade-panel h3{font-size:12px;color:#8b949e;text-transform:uppercase;letter-spacing:.6px}
.trade-btns{display:flex;gap:10px}
.btn-buy,.btn-sell{flex:1;padding:14px 8px;border:none;border-radius:8px;cursor:pointer;font-size:17px;font-weight:700;line-height:1.3;transition:filter .15s}
.btn-buy{background:#1a7f37;color:#fff}
.btn-buy:hover{filter:brightness(1.2)}
.btn-sell{background:#b62324;color:#fff}
.btn-sell:hover{filter:brightness(1.2)}
.btn-buy:disabled,.btn-sell:disabled{opacity:.35;cursor:not-allowed}
.btn-buy span,.btn-sell span{display:block;font-size:11px;font-weight:400;opacity:.85}

.pnl-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pnl-card{background:#21262d;border-radius:8px;padding:10px}
.pnl-card-label{font-size:11px;color:#8b949e;margin-bottom:4px}
.pnl-card-val{font-size:18px;font-weight:700}

.pos-panel{background:#161b22;padding:14px 16px}
.pos-panel h3{font-size:12px;color:#8b949e;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.pos-info{background:#21262d;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.pos-info-row{display:flex;justify-content:space-between;align-items:center}
.pos-info-key{font-size:12px;color:#8b949e}
.pos-info-val{font-size:14px;font-weight:600}

.trade-log{margin-top:12px;overflow-y:auto;max-height:130px}
.trade-log table{width:100%;border-collapse:collapse;font-size:12px}
.trade-log th{color:#8b949e;font-weight:500;padding:4px 8px;border-bottom:1px solid #30363d;text-align:left}
.trade-log td{padding:4px 8px;border-bottom:1px solid #21262d}
.long-tag{color:#3fb950}.short-tag{color:#f85149}

/* ── Proxy badge ── */
.proxy-badge{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:600;white-space:nowrap}
.proxy-badge.local{background:#0d3a1a;color:#3fb950;border:1px solid #238636}
.proxy-badge.public{background:#2d2000;color:#d29922;border:1px solid #9a6700}

/* ── Responsive ── */
@media(max-width:700px){
  .charts-wrap,.bottom{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="header">
  <h1>📈 デイトレードシミュレーター</h1>
  <span id="proxyBadge" class="proxy-badge public">■ 公開プロキシ使用中</span>
  <div class="api-row">
    <label>日付指定（空白=最新）:</label>

<div class="info-bar">

  </div>

<div class="charts-wrap">

<div class="controls">

</div>

<div class="bottom">
  <div class="trade-panel">
    <h3>売買注文 (1単元 100株)</h3>
    <div class="trade-btns">
      <button class="btn-buy" id="btnBuy" onclick="executeTrade('buy')" disabled>
        買い<span>100株 新規 / 空売返済</span>
      </button>
      <button class="btn-sell" id="btnSell" onclick="executeTrade('sell')" disabled>
        売り<span>100株 新規 / 買返済</span>
      </button>
    </div>
    <div class="pnl-row">
      <div class="pnl-card">
        <div class="pnl-card-label">評価損益</div>
        <div class="pnl-card-val neu" id="unrealizedPnL">¥0</div>
      </div>
      <div class="pnl-card">
        <div class="pnl-card-label">確定損益（本日合計）</div>
        <div class="pnl-card-val neu" id="realizedPnL">¥0</div>
      </div>
    </div>
    <div class="pnl-row">
      <div class="pnl-card" style="grid-column:1/-1">
        <div class="pnl-card-label">総損益（評価＋確定）</div>
        <div class="pnl-card-val neu" id="totalPnL">¥0</div>
      </div>

  </div>

  <div class="pos-panel">
    <h3>現在ポジション</h3>
    <div class="pos-info" id="posInfo">
      <div class="pos-info-row">
        <span class="pos-info-key">方向</span>
        <span class="pos-info-val neu" id="posDirection">なし</span>
      </div>
      <div class="pos-info-row">
        <span class="pos-info-key">数量</span>
        <span class="pos-info-val" id="posShares">0 株</span>
      </div>
      <div class="pos-info-row">
        <span class="pos-info-key">平均取得単価</span>
        <span class="pos-info-val" id="posAvgPrice">---</span>
      </div>
      <div class="pos-info-row">
        <span class="pos-info-key">取引コスト (往復概算)</span>

    <div class="trade-log">

          <tr><td colspan="5" style="color:#8b949e;text-align:center;padding:10px">約定履歴なし</td></tr>

<script>
// ================================================================
// CONSTANTS
// ================================================================
const SESSION1_START = 9 * 60;        // 540
const SESSION1_END   = 11 * 60 + 30;  // 690  (150分)
const SESSION2_START = 12 * 60 + 30;  // 750
const SESSION2_END   = 15 * 60 + 30;  // 930  (180分)
const TOTAL_MINS     = 150 + 180;     // 330

const PRIME_STOCKS = [
  {symbol:'7203.T', name:'トヨタ自動車'},
  {symbol:'6758.T', name:'ソニーグループ'},
  {symbol:'9984.T', name:'ソフトバンクグループ'},
  {symbol:'8306.T', name:'三菱UFJフィナンシャル'},
  {symbol:'6861.T', name:'キーエンス'},
  {symbol:'7974.T', name:'任天堂'},
  {symbol:'4063.T', name:'信越化学工業'},
  {symbol:'6954.T', name:'ファナック'},
  {symbol:'9432.T', name:'NTT'},
  {symbol:'8035.T', name:'東京エレクトロン'},
  {symbol:'6501.T', name:'日立製作所'},
  {symbol:'4661.T', name:'オリエンタルランド'},
  {symbol:'9983.T', name:'ファーストリテイリング'},
  {symbol:'6367.T', name:'ダイキン工業'},
  {symbol:'6902.T', name:'デンソー'},
  {symbol:'7267.T', name:'ホンダ'},
  {symbol:'6981.T', name:'村田製作所'},
  {symbol:'4543.T', name:'テルモ'},
  {symbol:'8316.T', name:'三井住友FG'},
  {symbol:'2914.T', name:'JT'},
];

// ================================================================
// STATE
// ================================================================
const st = {
  nikkeiData: [],   // [{minute, price}] × 330
  stockData:  [],   // [{minute, price}] × 330
  stockSymbol: '', stockName: '',
  prevCloseNikkei: null, prevCloseStock: null,
  currentIdx: 0,
  timer: null, isRunning: false, isFast: false,
  dataLoaded: false,
  // Position (net)
  netPos: 0,        // >0=long, <0=short, 0=flat
  avgPrice: 0,
  realizedPnL: 0,
  tradeLog: [],     // [{time, dir, shares, price, pnl}]
};

// ================================================================
// TIME HELPERS
// ================================================================
function idxToMin(i) {
  return i < 150 ? SESSION1_START + i : SESSION2_START + (i - 150);
}
function minToHHMM(m) {
  return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
}
function fmtYen(v, sign=true) {
  const s = sign && v >= 0 ? '+' : '';
  return s + '¥' + Math.round(v).toLocaleString('ja-JP');
}
function fmtPrice(v) {
  if (v == null) return '---';
  return '¥' + v.toLocaleString('ja-JP', {minimumFractionDigits:0, maximumFractionDigits:2});
}

// ================================================================
// OHLC CACHE (localStorage — 2回目以降のネットワーク不要化)
// ================================================================
function ohlcCacheGet(symbol, targetDate) {
  try {
    const key = `ohlc_${symbol}_${targetDate || 'latest'}`;
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const { data, savedAt, ttl } = JSON.parse(raw);
    if (Date.now() - savedAt > ttl) { localStorage.removeItem(key); return null; }
    return { ...data, source: 'cache' };
  } catch(_) { return null; }
}
function ohlcCacheSet(symbol, targetDate, data) {
  try {
    const key = `ohlc_${symbol}_${targetDate || 'latest'}`;
    const ttl = targetDate ? 7 * 86400000 : 24 * 3600000; // 指定日7日, 最新24時間
    localStorage.setItem(key, JSON.stringify({ data, savedAt: Date.now(), ttl }));
  } catch(_) {}
}

// ================================================================
// OHLC 取得（Yahoo Finance + stooq を並列レース、最速ソースを採用）
// ================================================================

// ローカルプロキシ（server.py が起動中の場合のみ有効）
let LOCAL_PROXY_URL = null; // 'http://localhost:8765/proxy?url=' or null

async function detectLocalProxy() {
  try {
    const res = await fetch('http://localhost:8765/health',
      { signal: AbortSignal.timeout(400) });
    if (res.ok) LOCAL_PROXY_URL = 'http://localhost:8765/proxy?url=';
  } catch (_) { LOCAL_PROXY_URL = null; }
  updateProxyBadge();
}

function updateProxyBadge() {
  const el = document.getElementById('proxyBadge');
  if (!el) return;
  if (LOCAL_PROXY_URL) {
    el.className = 'proxy-badge local';
    el.textContent = '■ ローカルプロキシ稼働中';
  } else {
    el.className = 'proxy-badge public';
    el.textContent = '■ 公開プロキシ使用中';
  }
}

// 公開 CORS プロキシ変換関数リスト（Yahoo/stooq 共用）
const OHLC_PROX = [
  u => 'https://api.allorigins.win/raw?url='      + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?'                   + encodeURIComponent(u),
  u => 'https://thingproxy.freeboard.io/fetch/'   + u,
];

function buildYahooOhlcUrl(symbol, targetDate) {
  let query;
  if (targetDate) {
    const t = new Date(targetDate).getTime();
    query = `interval=1d&period1=${Math.floor((t - 14*86400000)/1000)}&period2=${Math.floor((t + 3*86400000)/1000)}`;
  } else {
    query = 'interval=1d&range=1mo';
  }
  return `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?${query}`;
}

function buildStooqOhlcUrl(symbol, targetDate) {
  const s      = /^\^N225$/i.test(symbol) ? '^nky' : symbol.replace(/\.T$/i, '.jp');
  const endStr = targetDate || new Date().toISOString().slice(0, 10);
  const d1     = new Date(new Date(endStr).getTime() - 20*86400000).toISOString().slice(0,10).replace(/-/g,'');
  const d2     = endStr.replace(/-/g, '');
  return `https://stooq.com/q/d/l/?s=${encodeURIComponent(s)}&i=d&d1=${d1}&d2=${d2}`;
}

function parseYahooOhlc(json, symbol, targetDate) {
  const result = json?.chart?.result?.[0];
  if (!result) throw new Error(json?.chart?.error?.description || `${symbol}: データなし`);
  const q = result.indicators.quote[0], ts = result.timestamp;
  let last;
  if (targetDate) {
    last = -1;
    for (let i = ts.length - 1; i >= 0; i--) {
      const dUtc = new Date(ts[i]*1000).toISOString().slice(0,10);
      const dJst = new Date((ts[i]+9*3600)*1000).toISOString().slice(0,10);
      if ((dUtc === targetDate || dJst === targetDate) && q.open[i] != null) { last = i; break; }
    }
    if (last === -1) throw new Error(`${targetDate} は東証非取引日です（土日・祝日・年末年始など）`);
  } else {
    last = ts.length - 1;
    while (last > 0 && (q.open[last] == null || q.close[last] == null)) last--;
    if (q.open[last] == null) throw new Error(`${symbol}: 有効なOHLCデータが見つかりません`);
  }
  const ohlc     = { open: q.open[last], high: q.high[last], low: q.low[last], close: q.close[last] };
  const prevClose = (last > 0 ? q.close[last-1] : null) ?? result.meta.previousClose;
  const date      = new Date((ts[last]+9*3600)*1000).toISOString().slice(0,10);
  return { ohlc, prevClose, date, source: 'yahoo' };
}

function parseStooqCsv(csv, symbol, targetDate) {
  const rows = csv.trim().split('\n').slice(1)
    .map(line => { const [date,open,high,low,close] = line.split(','); return {date,open:+open,high:+high,low:+low,close:+close}; })
    .filter(r => r.open && r.close)
    .sort((a,b) => a.date < b.date ? -1 : 1);
  if (!rows.length) throw new Error(`${symbol}: stooqからデータが取得できません`);
  let last;
  if (targetDate) {
    last = rows.findLastIndex(r => r.date === targetDate);
    if (last === -1) throw new Error(`${targetDate} は東証非取引日です（土日・祝日・年末年始など）`);
  } else { last = rows.length - 1; }
  const row = rows[last], prevClose = last > 0 ? rows[last-1].close : null;
  return { ohlc: {open:row.open,high:row.high,low:row.low,close:row.close}, prevClose, date:row.date, source:'stooq' };
}

async function fetchYahoo(symbol, targetDate = '') {
  const cached = ohlcCacheGet(symbol, targetDate);
  if (cached) return cached;

  const yfUrl    = buildYahooOhlcUrl(symbol, targetDate);
  const q2Url    = yfUrl.replace('query1.finance.yahoo.com', 'query2.finance.yahoo.com');
  const stooqUrl = buildStooqOhlcUrl(symbol, targetDate);

  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), 8000);

  const tryY = url =>
    fetch(url, { signal: ctrl.signal })
      .then(res => { if (!res.ok) throw 0; return res.json(); })
      .then(d   => { if (!d?.chart?.result?.[0]) throw 0; return parseYahooOhlc(d, symbol, targetDate); });

  const tryS = url =>
    fetch(url, { signal: ctrl.signal })
      .then(res => { if (!res.ok) throw 0; return res.text(); })
      .then(t   => { if (!t.startsWith('Date,')) throw 0; return parseStooqCsv(t, symbol, targetDate); });

  const localProxies = LOCAL_PROXY_URL
    ? [u => LOCAL_PROXY_URL + encodeURIComponent(u)]
    : [];

  try {
    const r = await Promise.any([
      ...[...localProxies, ...OHLC_PROX].map(fn => tryY(fn(yfUrl))), // Yahoo 経由（ローカル優先）
      tryY(yfUrl), tryY(q2Url),               // Yahoo 直接（CORS通る環境のみ有効）
      ...[...localProxies, ...OHLC_PROX].map(fn => tryS(fn(stooqUrl))), // stooq 経由（ローカル優先）
    ]);
    clearTimeout(tid); ctrl.abort();
    ohlcCacheSet(symbol, targetDate, r);
    return r;
  } catch (_) {
    clearTimeout(tid);
    throw new Error(`${symbol}: 全ソースからデータを取得できませんでした`);
  }
}

// ================================================================
// 1分足リアルデータ取得
// ================================================================
function intradayCacheGet(symbol, targetDate) {
  try {
    const key = `intra_${symbol}_${targetDate || 'latest'}`;
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const { data, savedAt, ttl } = JSON.parse(raw);
    if (Date.now() - savedAt > ttl) { localStorage.removeItem(key); return null; }
    return data;
  } catch(_) { return null; }
}
function intradayCacheSet(symbol, targetDate, data) {
  try {
    const key = `intra_${symbol}_${targetDate || 'latest'}`;
    const ttl = targetDate ? 15 * 86400000 : 24 * 3600000; // 指定日15日, 最新24時間
    localStorage.setItem(key, JSON.stringify({ data, savedAt: Date.now(), ttl }));
  } catch(_) {}
}

// UnixタイムスタンプをJST分足スロット(0-329)に変換
function tsToSlot(unixTs) {
  const jstSec   = unixTs + 9 * 3600;
  const minOfDay = Math.floor(jstSec / 60) % 1440;
  if (minOfDay >= 540 && minOfDay < 690) return minOfDay - 540;       // 前場
  if (minOfDay >= 750 && minOfDay < 930) return 150 + (minOfDay - 750); // 後場
  return -1;
}

async function fetchIntraday(symbol, targetDate) {
  const cached = intradayCacheGet(symbol, targetDate);
  if (cached) return cached;

  let yfUrl;
  if (targetDate) {
    // targetDate は YYYY-MM-DD (UTC 00:00 = JST 09:00 = 前場開始)
    const t = new Date(targetDate).getTime();
    const period1 = Math.floor(t / 1000);
    const period2 = Math.floor((t + 7 * 3600000) / 1000); // 07:00 UTC = 16:00 JST
    yfUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1m&period1=${period1}&period2=${period2}`;
  } else {
    yfUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1m&range=1d`;
  }
  const q2Url = yfUrl.replace('query1.finance.yahoo.com', 'query2.finance.yahoo.com');
  const ctrl  = new AbortController();
  const tid   = setTimeout(() => ctrl.abort(), 8000);

  const localProxiesI = LOCAL_PROXY_URL
    ? [u => LOCAL_PROXY_URL + encodeURIComponent(u)]
    : [];

  let json;
  try {
    json = await Promise.any(
      [...localProxiesI, ...OHLC_PROX].map(fn => fn(yfUrl))
        .concat([yfUrl, q2Url])
        .map(url =>
          fetch(url, { signal: ctrl.signal })
            .then(res => { if (!res.ok) throw 0; return res.json(); })
            .then(d   => { if (!(d?.chart?.result?.[0]?.timestamp?.length > 50)) throw 0; return d; })
        )
    );
    clearTimeout(tid); ctrl.abort();
  } catch (_) {
    clearTimeout(tid);
    return null; // 失敗時は合成データにフォールバック
  }

  const result = json.chart.result[0];
  const q  = result.indicators.quote[0];
  const ts = result.timestamp;

  // 330スロットに値をマッピング
  const slots = new Array(330).fill(null);
  for (let i = 0; i < ts.length; i++) {
    const price = q.close[i] ?? q.open[i];
    if (price == null) continue;
    const slot = tsToSlot(ts[i]);
    if (slot >= 0) slots[slot] = price;
  }

  // データが少なすぎる場合は合成にフォールバック
  const filled = slots.filter(x => x !== null).length;
  if (filled < 120) return null;

  // 前後補間でギャップを埋める
  for (let i = 1; i < 330; i++) {
    if (slots[i] == null && slots[i-1] != null) slots[i] = slots[i-1];
  }
  for (let i = 328; i >= 0; i--) {
    if (slots[i] == null && slots[i+1] != null) slots[i] = slots[i+1];
  }

  const data = slots.map((price, i) => ({ minute: idxToMin(i), price: price || 0 }));
  intradayCacheSet(symbol, targetDate, data);
  return data;
}

// ================================================================
// GENERATE SYNTHETIC 1-MIN DATA FROM DAILY OHLC
// ================================================================
function generateIntraday(open, high, low, close) {
  function gaussRand() {
    let u=0,v=0;
    while(u===0)u=Math.random(); while(v===0)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  }
  function randInt(lo,hi){return Math.floor(lo+Math.random()*(hi-lo));}

  // Scenario: where in the day do high/low appear?
  const ZONES={earlyAM:[5,70],lateAM:[70,148],earlyPM:[152,220],latePM:[220,325]};
  const scenarios=[
    {w:.30,hZ:'earlyAM',lZ:'latePM'},
    {w:.25,hZ:'latePM', lZ:'earlyAM'},
    {w:.25,hZ:'lateAM', lZ:'earlyPM'},
    {w:.20,hZ:'earlyPM',lZ:'lateAM'},
  ];
  let r=Math.random(),cum=0,sc=scenarios[0];
  for(const s of scenarios){cum+=s.w;if(r<cum){sc=s;break;}}

  let hIdx=randInt(...ZONES[sc.hZ]), lIdx=randInt(...ZONES[sc.lZ]);
  if(hIdx===lIdx) lIdx=Math.min(lIdx+6,325);

  const wps=[{idx:0,price:open},{idx:hIdx,price:high},{idx:lIdx,price:low},{idx:329,price:close}];

  // 1〜2個の中間ウェイポイントを追加（自然な曲線のため）
  const range=high-low||1;
  const nExtra=1+Math.floor(Math.random()*2);
  for(let e=0;e<nExtra;e++){
    const sorted=[...wps].sort((a,b)=>a.idx-b.idx);
    let maxGap=0,gk=0;
    for(let k=0;k<sorted.length-1;k++){const g=sorted[k+1].idx-sorted[k].idx;if(g>maxGap){maxGap=g;gk=k;}}
    if(maxGap<10)break;
    const g0=sorted[gk],g1=sorted[gk+1];
    const mi=randInt(g0.idx+3,g1.idx-3);
    const mp=g0.price+(g1.price-g0.price)*((mi-g0.idx)/(g1.idx-g0.idx))+gaussRand()*range*0.12;
    wps.push({idx:mi,price:mp});
  }
  wps.sort((a,b)=>a.idx-b.idx);
  const NW=wps.length;

  // Catmull-Rom タンジェント計算
  const tan=new Array(NW);
  for(let k=0;k<NW;k++){
    if(k===0)        tan[k]=(wps[1].price-wps[0].price)/(wps[1].idx-wps[0].idx);
    else if(k===NW-1)tan[k]=(wps[NW-1].price-wps[NW-2].price)/(wps[NW-1].idx-wps[NW-2].idx);
    else             tan[k]=(wps[k+1].price-wps[k-1].price)/(wps[k+1].idx-wps[k-1].idx);
  }

  // Cubic Hermite 補間
  const base=new Float64Array(330);
  for(let k=0;k<NW-1;k++){
    const p0=wps[k].price,p1=wps[k+1].price;
    const i0=wps[k].idx,  i1=wps[k+1].idx;
    const m0=tan[k],      m1=tan[k+1];
    const seg=i1-i0;
    for(let i=i0;i<=i1;i++){
      const t=(i-i0)/seg,t2=t*t,t3=t2*t;
      base[i]=(2*t3-3*t2+1)*p0+(t3-2*t2+t)*m0*seg+(-2*t3+3*t2)*p1+(t3-t2)*m1*seg;
    }
  }

  // ガウスノイズ + 3点スムージング
  const noisy=new Float64Array(330);
  const sig=range*0.008;
  for(let i=0;i<330;i++) noisy[i]=base[i]+(i===0||i===329?0:gaussRand()*sig);
  const sm=new Float64Array(330);
  sm[0]=open; sm[329]=close;
  for(let i=1;i<=328;i++) sm[i]=.25*noisy[i-1]+.50*noisy[i]+.25*noisy[i+1];

  // クランプ + 端点固定
  const minP=low*.998, maxP=high*1.002;
  for(let i=0;i<330;i++) sm[i]=Math.max(minP,Math.min(maxP,sm[i]));
  sm[0]=open; sm[329]=close;

  const result=[];
  for(let i=0;i<330;i++) result.push({minute:idxToMin(i), price:sm[i]});
  return result;
}

// ================================================================
// LOAD DATA
// ================================================================
async function loadData() {
  const btn = document.getElementById('btnLoad');
  btn.disabled = true; btn.textContent = '読込中…';
  setStatus('データ取得中…');

  const stock = PRIME_STOCKS[Math.floor(Math.random() * PRIME_STOCKS.length)];
  st.stockSymbol = stock.symbol;
  st.stockName   = stock.name;

  try {
    // 日付指定（空白なら最新）
    const targetDate = document.getElementById('dateInput').value; // "YYYY-MM-DD" or ""

    // 株・日経を Yahoo Finance から並列取得
    const [sResult, nResult] = await Promise.allSettled([
      fetchYahoo(stock.symbol, targetDate),
      fetchYahoo('1321.T', targetDate),
    ]);

    if (sResult.status === 'rejected') throw new Error(sResult.reason.message);
    const sRes = sResult.value;

    // 日経: 失敗時は株の騰落率から相関合成
    let nOHLC, nPrevClose, nDate;
    if (nResult.status === 'fulfilled') {
      nOHLC = nResult.value.ohlc; nPrevClose = nResult.value.prevClose; nDate = nResult.value.date;
    } else {
      const NIKKEI_BASE = 53500, NIKKEI_RANGE = 400;
      const sPct  = (sRes.ohlc.close - sRes.ohlc.open) / sRes.ohlc.open;
      const nPct  = sPct * (0.6 + Math.random() * 0.3) + (Math.random() - 0.5) * 0.006;
      const nOpen = NIKKEI_BASE + (Math.random() - 0.5) * NIKKEI_RANGE * 0.5;
      const swing = Math.abs(nPct) * nOpen * 0.5 + Math.random() * NIKKEI_RANGE * 0.3;
      nOHLC      = { open: nOpen, close: nOpen*(1+nPct),
                     high: Math.max(nOpen, nOpen*(1+nPct))+swing,
                     low:  Math.min(nOpen, nOpen*(1+nPct))-swing };
      nPrevClose = nOpen * (1 - (Math.random()-0.5)*0.008);
      nDate      = '合成';
    }

    st.prevCloseNikkei = nPrevClose;
    st.prevCloseStock  = sRes.prevClose;

    // 実際の1分足データ取得（失敗時はOHLCから合成）
    setStatus('分足データ取得中…');
    const [sIntra, nIntra] = await Promise.allSettled([
      fetchIntraday(stock.symbol, targetDate),
      fetchIntraday('1321.T', targetDate),  // ^N225 インデックスは取得困難 → ETF で代替
    ]);
    const sIntraData = sIntra.status === 'fulfilled' ? sIntra.value : null;
    // 1321.T の価格は日経平均と概ね 1:1 のため換算不要
    const nIntraData = (nIntra.status === 'fulfilled' && nIntra.value)
      ? nIntra.value
      : null;

    st.stockData  = sIntraData || generateIntraday(sRes.ohlc.open, sRes.ohlc.high, sRes.ohlc.low, sRes.ohlc.close);
    st.nikkeiData = nIntraData || generateIntraday(nOHLC.open, nOHLC.high, nOHLC.low, nOHLC.close);
    st.dataLoaded = true;

    const srcName   = s => s === 'yahoo' ? 'Yahoo Finance' : s === 'stooq' ? 'stooq.com' : 'キャッシュ';
    const nSrc      = nResult.status === 'fulfilled' ? srcName(nResult.value.source) : '合成';
    const sSrc      = srcName(sRes.source);
    const sIntraLbl = sIntraData ? '実データ' : 'シミュ';
    const nIntraLbl = nIntraData ? '実データ' : 'シミュ';

    document.getElementById('nikkeiLabel').textContent =
      `日経225ETF (1321.T) [${nSrc}・${nIntraLbl}] — ${nDate}`;
    document.getElementById('stockLabel').textContent =
      `${stock.name} (${stock.symbol}) [${sSrc}・${sIntraLbl}] — ${sRes.date}`;
    document.getElementById('stockName').textContent =
      `${stock.name} (${stock.symbol})`;

    ['btnStart','btnFast','btnReset','btnBuy','btnSell'].forEach(id =>
      document.getElementById(id).disabled = false);

    resetSim(true);
    setStatus(`読込完了 ✓  ${stock.name} ${sRes.date} [${sSrc}・${sIntraLbl}] / 日経 ${nDate} [${nSrc}・${nIntraLbl}]`);
  } catch(e) {
    setStatus('エラー: ' + e.message);
    alert('データ取得エラー:\n' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'データ読込';
  }
}

// ================================================================
// CHART DRAWING
// ================================================================
function drawChart(id, data, endIdx, prevClose, showFull) {
  const canvas = document.getElementById(id);
  const dpr    = window.devicePixelRatio || 1;
  const cssW   = canvas.clientWidth  || 600;
  const cssH   = 280;
  canvas.width  = cssW * dpr;
  canvas.height = cssH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = cssW, H = cssH;

  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  if (!data || data.length === 0) {
    ctx.fillStyle = '#8b949e'; ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('データなし', W/2, H/2); return;
  }

  const PAD = {top:12, right:68, bottom:28, left:6};
  const pw = W - PAD.left - PAD.right;
  const ph = H - PAD.top  - PAD.bottom;

  const displayEnd = showFull ? data.length - 1 : Math.max(endIdx, 0);
  const slice = data.slice(0, displayEnd + 1);
  if (slice.length === 0) return;

  const prices = slice.map(d => d.price);
  let lo = Math.min(...prices), hi = Math.max(...prices);
  if (prevClose != null) { lo = Math.min(lo, prevClose); hi = Math.max(hi, prevClose); }
  const rng  = hi - lo || 1;
  const pad5 = rng * 0.05;
  const yLo  = lo - pad5, yHi = hi + pad5;
  const yRng = yHi - yLo;

  const xOf = i => PAD.left + (i / (TOTAL_MINS-1)) * pw;
  const yOf = p => PAD.top + ph - ((p - yLo) / yRng) * ph;

  // Grid
  ctx.strokeStyle = '#21262d'; ctx.lineWidth = 1;
  for (let g=0; g<=4; g++) {
    const y = PAD.top + ph/4 * g;
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + pw, y); ctx.stroke();
  }

  // Lunch-break separator
  const lunchX = xOf(150);
  ctx.strokeStyle = '#30363d'; ctx.lineWidth = 2;
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(lunchX, PAD.top); ctx.lineTo(lunchX, PAD.top+ph); ctx.stroke();
  ctx.setLineDash([]);

  // Prev-close line
  if (prevClose != null) {
    const pcY = yOf(prevClose);
    ctx.strokeStyle = '#484f58'; ctx.lineWidth = 1;
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(PAD.left, pcY); ctx.lineTo(PAD.left+pw, pcY); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Price line
  const lastP = slice[slice.length-1].price;
  const lineColor = prevClose == null ? '#58a6ff'
                  : (lastP >= prevClose ? '#3fb950' : '#f85149');

  ctx.strokeStyle = lineColor; ctx.lineWidth = 2;
  ctx.beginPath();
  slice.forEach((d, i) => {
    const x = xOf(i), y = yOf(d.price);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();

  // Current-time marker (stock chart only)
  if (!showFull && displayEnd > 0) {
    const cx = xOf(displayEnd);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth=1;
    ctx.setLineDash([2,2]);
    ctx.beginPath(); ctx.moveTo(cx,PAD.top); ctx.lineTo(cx,PAD.top+ph); ctx.stroke();
    ctx.setLineDash([]);
    const cy = yOf(slice[slice.length-1].price);
    ctx.fillStyle = lineColor;
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2); ctx.fill();
  }

  // Y-axis labels
  ctx.fillStyle = '#8b949e'; ctx.font = '10px monospace'; ctx.textAlign = 'left';
  for (let g=0; g<=4; g++) {
    const p = yLo + yRng/4*(4-g);
    const y = PAD.top + ph/4*g;
    ctx.fillText(Math.round(p).toLocaleString('ja-JP'), PAD.left+pw+4, y+4);
  }

  // X-axis time labels
  ctx.fillStyle = '#8b949e'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
  [[0,'9:00'],[75,'10:15'],[149,'11:30'],[150,'12:30'],[240,'14:00'],[329,'15:30']].forEach(([i,label]) => {
    if (i <= data.length-1) ctx.fillText(label, xOf(i), H-6);
  });
}

function redrawAll() {
  drawChart('nikkeiChart', st.nikkeiData, st.currentIdx, st.prevCloseNikkei, false);
  drawChart('stockChart',  st.stockData,  st.currentIdx, st.prevCloseStock, false);
}

// ================================================================
// SIMULATION
// ================================================================
function toggleSim() {
  if (!st.dataLoaded) return;
  if (st.isRunning) { pauseSim(); } else { startSim(); }
}

function startSim() {
  if (st.currentIdx >= TOTAL_MINS-1) return;
  st.isRunning = true;
  document.getElementById('btnStart').textContent = '⏸ 一時停止';
  document.getElementById('btnStart').className = 'ctrl-btn btn-pause';

  st.timer = setInterval(() => {
    const steps = st.isFast ? 5 : 1;
    st.currentIdx = Math.min(st.currentIdx + steps, TOTAL_MINS-1);
    refreshUI();
    if (st.currentIdx >= TOTAL_MINS-1) {
      pauseSim();
      setStatus('📊 本日の取引終了（15:30）');
    }
  }, 1000);
}

function pauseSim() {
  clearInterval(st.timer); st.timer = null; st.isRunning = false;
  document.getElementById('btnStart').textContent = '▶ 再開';
  document.getElementById('btnStart').className = 'ctrl-btn btn-start';
}

function resetSim(keepData=false) {
  pauseSim();
  st.currentIdx   = 0;
  st.netPos       = 0;
  st.avgPrice     = 0;
  st.realizedPnL  = 0;
  st.tradeLog     = [];
  st.isFast       = false;
  document.getElementById('btnFast').classList.remove('active');
  document.getElementById('speedLabel').textContent = '通常 (1秒 = 1分)';
  document.getElementById('btnStart').textContent = '▶ 開始';
  document.getElementById('btnStart').className = 'ctrl-btn btn-start';
  if (st.dataLoaded) refreshUI();
}

function toggleFast() {
  st.isFast = !st.isFast;
  const btn = document.getElementById('btnFast');
  if (st.isFast) {
    btn.classList.add('active');
    document.getElementById('speedLabel').textContent = '早送り (1秒 = 5分)';
  } else {
    btn.classList.remove('active');
    document.getElementById('speedLabel').textContent = '通常 (1秒 = 1分)';
  }
}

// ================================================================
// TRADING
// ================================================================
function executeTrade(type) {
  if (!st.dataLoaded || !st.isRunning) {
    if (!st.isRunning) alert('シミュレーションを開始してから注文してください');
    return;
  }
  const price  = st.stockData[st.currentIdx].price;
  const shares = 100;
  const delta  = type === 'buy' ? shares : -shares;
  const timeStr = minToHHMM(idxToMin(st.currentIdx));
  let closedPnl = null;

  if (st.netPos === 0) {
    // 新規建て
    st.netPos   = delta;
    st.avgPrice = price;
  } else if (Math.sign(st.netPos) === Math.sign(delta)) {
    // 同方向追加（ドテン前の同方向）
    const totalShares = Math.abs(st.netPos) + shares;
    st.avgPrice = (st.avgPrice * Math.abs(st.netPos) + price * shares) / totalShares;
    st.netPos  += delta;
  } else {
    // 反対売買
    const absPos   = Math.abs(st.netPos);
    const closeShares = Math.min(absPos, shares);
    const pnlPerShare = st.netPos > 0 ? (price - st.avgPrice) : (st.avgPrice - price);
    closedPnl = pnlPerShare * closeShares;
    st.realizedPnL += closedPnl;

    const remain = absPos - shares; // negative if over-close
    if (remain > 0) {
      // 一部決済
      st.netPos = st.netPos > 0 ? remain : -remain;
      // avgPrice unchanged
    } else if (remain === 0) {
      // 全決済
      st.netPos = 0; st.avgPrice = 0;
    } else {
      // ドテン
      st.netPos   = delta > 0 ? -remain : remain; // open opposite
      st.avgPrice = price;
    }
  }

  // Log
  const dir = type === 'buy' ? '買' : '売';
  st.tradeLog.unshift({time: timeStr, dir, shares, price, pnl: closedPnl});

  refreshUI();
}

// ================================================================
// UI REFRESH
// ================================================================
function refreshUI() {
  const idx    = st.currentIdx;
  const minute = idxToMin(idx);
  const price  = st.stockData[idx]?.price ?? 0;

  // Time
  document.getElementById('simTime').textContent = minToHHMM(minute);

  // Price display
  document.getElementById('currentPrice').textContent = fmtPrice(price);
  if (st.prevCloseStock) {
    const diff = price - st.prevCloseStock;
    const pct  = (diff / st.prevCloseStock * 100).toFixed(2);
    const s    = diff >= 0 ? '+' : '';
    const el   = document.getElementById('priceChange');
    el.textContent = `${s}${Math.round(diff).toLocaleString()} (${s}${pct}%)`;
    el.className = 'info-value ' + (diff >= 0 ? 'up' : 'down');
  }

  // PnL
  const unrealized = st.netPos === 0 ? 0
    : st.netPos > 0
      ? (price - st.avgPrice) * st.netPos
      : (st.avgPrice - price) * Math.abs(st.netPos);
  const total = unrealized + st.realizedPnL;

  setValColor('unrealizedPnL', unrealized, fmtYen(unrealized));
  setValColor('realizedPnL',   st.realizedPnL, fmtYen(st.realizedPnL));
  setValColor('totalPnL',      total, fmtYen(total));

  // Position info
  const dirEl = document.getElementById('posDirection');
  if (st.netPos > 0) {
    dirEl.textContent = 'ロング（買い）';
    dirEl.className = 'pos-info-val long-tag';
  } else if (st.netPos < 0) {
    dirEl.textContent = 'ショート（売り）';
    dirEl.className = 'pos-info-val short-tag';
  } else {
    dirEl.textContent = 'なし（フラット）';
    dirEl.className = 'pos-info-val neu';
  }
  document.getElementById('posShares').textContent =
    st.netPos === 0 ? '0 株' : `${Math.abs(st.netPos)} 株`;
  document.getElementById('posAvgPrice').textContent =
    st.netPos === 0 ? '---' : fmtPrice(st.avgPrice);
  const cost = st.netPos !== 0 ? Math.abs(st.netPos) * st.avgPrice * 0.001 : 0;
  document.getElementById('posCost').textContent =
    st.netPos === 0 ? '---' : `概算 ¥${Math.round(cost).toLocaleString()}`;

  // Trade log
  const tbody = document.getElementById('tradeLogBody');
  if (st.tradeLog.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="color:#8b949e;text-align:center;padding:8px">約定履歴なし</td></tr>';
  } else {
    tbody.innerHTML = st.tradeLog.slice(0,20).map(t => {
      const cls   = t.dir === '買' ? 'long-tag' : 'short-tag';
      const pnlStr = t.pnl == null ? '-' : `<span class="${t.pnl>=0?'up':'down'}">${fmtYen(t.pnl)}</span>`;
      return `<tr>
        <td>${t.time}</td>
        <td class="${cls}">${t.dir}</td>
        <td>${t.shares}株</td>
        <td>${fmtPrice(t.price)}</td>
        <td>${pnlStr}</td>
      </tr>`;
    }).join('');
  }

  // Charts
  redrawAll();
}

function setValColor(id, val, text) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'pnl-card-val ' + (val > 0 ? 'up' : val < 0 ? 'down' : 'neu');
}

function setStatus(msg) {
  document.getElementById('statusMsg').textContent = msg;
}

window.addEventListener('resize', () => { if (st.dataLoaded) redrawAll(); });
